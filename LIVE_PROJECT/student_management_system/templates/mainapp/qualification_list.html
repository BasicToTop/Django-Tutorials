{% extends "mainapp/base.html" %}
{% block body_block %}

<div style="margin-top: 2rem;">
    <h4 style="color: var(--primary); margin-bottom: 1.5rem; font-weight: 700;">
        Qualifications List
    </h4>

    <a href="{% url 'qualification' %}" class="btn btn-primary" style="margin-left: 85%;">
        Add New Qualification
    </a><br><br>

    <table class="table table-hover">
        <thead>
            <tr>
                <th>S.No.</th>
                <th>Qualification Name</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody>
            {% for q in qualifications %}
            <tr>
                <td>{{ forloop.counter }}</td>
                <td>{{ q.name }}</td>
                <td>
                    <a href="{% url 'qualification_edit' q.pk %}" class="btn btn-primary">Edit</a>
                    <a href="{% url 'qualification_delete' q.pk %}" class="btn btn-danger">Delete</a>
                    <a href="{% url 'qualification_detail' q.pk %}" class="btn btn-info">Details</a>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>

{% endblock %}
