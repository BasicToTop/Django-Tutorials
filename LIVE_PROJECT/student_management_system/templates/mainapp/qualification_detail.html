{% extends "mainapp/base.html" %}
{% block body_block %}

<h2>Qualification Details</h2>
<table class="table table-hover">
    <thead>
        <tr>
            <th>Column Name</th>
            <th>Column Value</th>
        </tr>
    </thead>
    <tbody>
        <tr>
            <td>Qualification Name</td>
            <td>{{ qualification.name }}</td>
        </tr>
        <tr>
            <td>Description</td>
            <td>{{ qualification.description }}</td>
        </tr>
    </tbody>
</table>

<a href="{% url 'qualification_list' %}" class="btn btn-secondary">
    Back to Qualification List
</a>

{% endblock %}
