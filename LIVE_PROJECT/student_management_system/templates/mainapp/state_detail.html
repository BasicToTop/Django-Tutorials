{% extends "mainapp/base.html" %}
{% block body_block %}

<h2>State Details</h2>
<table class="table table-hover">
    <thead>
        <tr>
            <th>Column Name</th>
            <th>Column Value</th>
        </tr>
    </thead>
    <tbody>
        <tr>
            <td>State Code</td>
            <td>{{ state.state_code }}</td>
        </tr>
        <tr>
            <td>State Name</td>
            <td>{{ state.state_name }}</td>
        </tr>
        <tr>
            <td>Country</td>
            <td>{{ state.country_name.country_name }}</td>
        </tr>
        <tr>
            <td>Description</td>
            <td>{{ state.description }}</td>
        </tr>
    </tbody>
</table>

<a href="{% url 'state_list' %}" class="btn btn-secondary">
    Back to State List
</a>

{% endblock %}
