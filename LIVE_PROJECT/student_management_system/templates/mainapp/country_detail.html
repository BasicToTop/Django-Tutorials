{% extends "mainapp/base.html" %}
{% block body_block %}

        <h2>Country Details</h2>
        <table class="table table-hover">
            <thead>
                <tr>
                    <th>Column Name</th>
                    <th>Column Value </th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>Country Code</td>
                    <td>{{ country.country_code }}</td>
                </tr>
                <tr>
                    <td>Country Name</td>
                    <td>{{ country.country_name }}</td>
                </tr>
                <tr>
                    <td>Country Description</td>
                    <td>{{ country.description }}</td>
                </tr>
            </tbody>
        </table>
                    <a href="{% url 'country_list' %}" class="btn btn-secondary">Back to Country List</a>

    {% endblock %}
